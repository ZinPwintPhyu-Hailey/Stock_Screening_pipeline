name: CSP Scheduler

on:
  schedule:
    - cron: "30 23 * * 5" # Saturday 7:30 AM Singapore = Friday 11:30 PM UTC
    - cron: "0 0 * * 1" # Monday 8:00 AM Singapore = Monday 12:00 AM UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    env:
      CSP_EMAIL_PASSWORD: ${{ secrets.CSP_EMAIL_PASSWORD }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Friday capture
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 23 * * 5'
        run: |
          python src/run_csp_screen.py --config config/settings.json --out-dir output

      - name: Send Monday email
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * 1'
        run: |
          python src/send_latest_snapshot_email.py --config config/settings.json --out-dir output
